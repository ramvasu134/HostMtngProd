# ============================================================
#  Render.com Blueprint  –  Host Student Meeting (WebRTC App)
#  Deploy with: https://dashboard.render.com/select-repo
#  Docs: https://render.com/docs/blueprint-spec
#
#  PRODUCTION NOTES:
#  - For 1000+ users, upgrade to 'standard' plans (always-on, no cold starts)
#  - Enable persistent disk for recordings or migrate to S3/Cloudinary
#  - Consider Redis add-on for WebSocket session scaling
# ============================================================

databases:
  - name: meeting-db
    databaseName: meeting_db
    user: meeting_user
    # Render PostgreSQL plans (use hyphens):
    # free | basic-256mb | basic-1gb | basic-4gb |
    # pro-4gb | pro-8gb | pro-16gb | pro-32gb | pro-64gb | pro-128gb |
    # pro-192gb | pro-256gb | pro-384gb | pro-512gb
    plan: pro-4gb
    region: oregon
    # Enable point-in-time recovery for production
    # ipAllowList: []  # Restrict to known IPs in production

services:
  - type: web
    name: host-student-meeting
    runtime: docker
    # PRODUCTION: Use 'starter' or 'standard' for always-on (no spin-down)
    # Free tier spins down after 15 mins of inactivity
    plan: starter  # Upgrade from 'free' for production use
    region: oregon
    branch: main
    healthCheckPath: /actuator/health
    
    # ── Scaling (requires paid plan) ──────────────────────────────────────────
    # numInstances: 2  # Minimum 2 for high availability
    # autoscaling:
    #   min: 2
    #   max: 5
    #   criteria:
    #     cpu:
    #       enabled: true
    #       percentage: 70

    # ── Build & Deploy settings ──────────────────────────────────────────────
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # ── Auto-deploy on push ──────────────────────────────────────────────────
    autoDeploy: true

    # ── Environment Variables ────────────────────────────────────────────────
    envVars:

      # Spring profile → use prod properties
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Public URL of this app. OPTIONAL on Render — the app auto-derives it
      # from RENDER_EXTERNAL_URL. Set this only when serving from a custom
      # domain (e.g. https://mtng.yourdomain.com). Used for WhatsApp recording
      # links, Twilio audio-clip media URLs, and the Twilio status callback.
      - key: APP_PUBLIC_URL
        sync: false

      # ── Twilio WhatsApp (audio clips to teachers) ──────────────────────────
      # REQUIRED for WhatsApp notifications. Set these once in the Render
      # dashboard (Environment → Add Environment Variable):
      #   TWILIO_ACCOUNT_SID   → ACxxxxxxxx... (Twilio Console home page)
      #   TWILIO_AUTH_TOKEN    → auth token (same page)
      #   TWILIO_WHATSAPP_FROM → whatsapp:+14155238886 (sandbox) or your
      #                          approved WhatsApp Business sender number
      # Sandbox note: each receiving phone must first send "join <code>" to
      # +1 415 523 8886 on WhatsApp (code shown in Twilio Console → Messaging
      # → Try it out). For unrestricted delivery, register a WhatsApp sender.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false

      # ── Database ──────────────────────────────────────────────────────────
      # Internal hostname (only reachable from Render services in same region)
      - key: DB_HOST
        value: dpg-d7hlidn7f7vs738lnim0-a
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: meeting_db_sr7r
      - key: DB_USER
        value: meeting_user
      # DB_PASSWORD must be set manually in the Render dashboard (not committed)
      - key: DB_PASSWORD
        sync: false

      # ── Database Pool Size ─────────────────────────────────────────────────
      - key: DB_POOL_SIZE
        value: "10"

      # ── Security ─────────────────────────────────────────────────────────
      # MANDATORY: Strong random JWT secret (auto-generated by Render)
      - key: JWT_SECRET
        generateValue: true

      # Teacher-independent mode:
      # - WHATSAPP_ENABLED=true allows each teacher to use their own number + API key
      # - External microservice is optional (off by default)
      - key: WHATSAPP_ENABLED
        value: "true"
      - key: NOTIFICATION_EXTERNAL_ENABLED
        value: "false"
      # Public HTTPS endpoint of notification-service, e.g. https://notification-service.onrender.com/notify
      - key: NOTIFICATION_EXTERNAL_URL
        sync: false
      # Auto-synced from notification-service's generated NOTIFICATION_INTERNAL_TOKEN
      # (see WHATSAPP_BAILEYS_TOKEN below for why fromService is required here
      # instead of a second independent generateValue: true).
      - key: NOTIFICATION_EXTERNAL_TOKEN
        fromService:
          type: web
          name: notification-service
          envVarKey: NOTIFICATION_INTERNAL_TOKEN
      - key: NOTIFICATION_EXTERNAL_MAX_ATTEMPTS
        value: "3"
      - key: NOTIFICATION_EXTERNAL_RETRY_DELAY_MS
        value: "2000"

      # ── WhatsApp via Baileys (OPTIONAL, free, off by default) ──────────────
      # Only takes effect if you also deploy the whatsapp-baileys-service
      # block below (or elsewhere) and link a number — see that folder's
      # README. Set to "false" to instantly revert to today's
      # Twilio/CallMeBot-only behavior (no other changes needed).
      - key: WHATSAPP_BAILEYS_ENABLED
        value: "true"
      # e.g. https://whatsapp-baileys-service.onrender.com
      - key: WHATSAPP_BAILEYS_URL
        sync: false
      # Auto-synced from whatsapp-baileys-service's generated NOTIFICATION_INTERNAL_TOKEN
      # (fromService pulls the *actual* generated value — generateValue on both sides
      # independently would NOT match, since each service generates its own random value).
      - key: WHATSAPP_BAILEYS_TOKEN
        fromService:
          type: web
          name: whatsapp-baileys-service
          envVarKey: NOTIFICATION_INTERNAL_TOKEN

      # ── WebRTC TURN relay (OPTIONAL, free, off by default) ─────────────────
      # Without this, WebRTC audio only works over STUN, which silently fails
      # for students behind symmetric/restrictive NATs (school Wi-Fi, mobile
      # data) — this was the root cause of some students having no audio.
      # Sign up free (20 GB/month, no card) at https://www.metered.ca/tools/openrelay/
      # then fill these in via the Render dashboard (kept sync:false — not secret-scanned).
      - key: TURN_APP_NAME
        sync: false
      - key: TURN_API_KEY
        sync: false

      # ── Data Seeding (enable once to create superadmin + demo users) ───────
      # After first successful login, set to "false" and redeploy for security
      - key: SEED_ENABLED
        value: "true"

      # ── WebSocket CORS Origins ─────────────────────────────────────────────
      # Set to your actual domain(s) in production
      - key: APP_WEBSOCKET_ALLOWED_ORIGINS
        value: "https://*.onrender.com,https://your-domain.com"

      # ── JVM tuning (starter plan = 512 MB RAM — SerialGC fastest cold start) ─
      - key: JAVA_OPTS
        value: "-server -XX:+UseContainerSupport -XX:MaxRAMPercentage=70.0 -XX:InitialRAMPercentage=25.0 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Djava.security.egd=file:/dev/./urandom -Dspring.jmx.enabled=false"

      # ── Disk paths (ephemeral - consider S3 for production) ────────────────
      - key: APP_UPLOAD_DIR
        value: /app/uploads
      - key: APP_RECORDING_DIR
        value: /app/recordings
      - key: APP_PROFILE_PHOTOS_DIR
        value: /app/profile-photos

    # ── Persistent Disk (optional, requires paid plan) ────────────────────────
    # disk:
    #   name: meeting-storage
    #   mountPath: /app/data
    #   sizeGB: 10

  - type: web
    name: notification-service
    runtime: node
    plan: starter
    region: oregon
    branch: main
    rootDir: notification-service
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_PHONE_NUMBER
        sync: false
      - key: NOTIFICATION_MAX_RETRIES
        value: "3"
      - key: NOTIFICATION_RETRY_DELAY_MS
        value: "2000"
      - key: NOTIFICATION_INTERNAL_TOKEN
        generateValue: true

  # ============================================================
  #  OPTIONAL — whatsapp-baileys-service (free/unofficial WhatsApp sender)
  #  Does nothing on its own. Only affects the app once you ALSO set
  #  WHATSAPP_BAILEYS_ENABLED=true + WHATSAPP_BAILEYS_URL above.
  #  See whatsapp-baileys-service/README.md before enabling this block
  #  (Terms-of-Service / ban-risk disclaimer, QR-linking steps).
  #  Remove this block entirely if you don't want to try it.
  # ============================================================
  - type: web
    name: whatsapp-baileys-service
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: whatsapp-baileys-service
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: "3100"
      # Reuses the SAME Postgres database as host-student-meeting (no new DB, $0 cost)
      - key: DB_HOST
        value: dpg-d7hlidn7f7vs738lnim0-a
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: meeting_db_sr7r
      - key: DB_USER
        value: meeting_user
      - key: DB_PASSWORD
        sync: false
      - key: BAILEYS_SESSION_ID
        value: default
      # Source of truth for WHATSAPP_BAILEYS_TOKEN on host-student-meeting above
      # (that service pulls this exact generated value via fromService).
      - key: NOTIFICATION_INTERNAL_TOKEN
        generateValue: true
      - key: BAILEYS_LOG_LEVEL
        value: warn

